<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KERNEL</title>
<style>
:root{
  --bg:#0B0B0D; --bg2:#101014; --panel:#141418; --panel2:#17171C;
  --stroke:#26262E; --stroke2:#32323C;
  --gold1:#B8860B; --gold2:#E8C15A; --gold3:#F5D77E;
  --txt:#EDEDF2; --dim:#9A9AA2; --dim2:#6E6E78;
  --green:#5BD17C; --red:#E8705C; --amber:#E8C15A;
  --goldgrad:linear-gradient(135deg,#B8860B 0%,#E8C15A 45%,#F5D77E 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:'Inter','Segoe UI',system-ui,sans-serif;
  font-size:14px; overflow:hidden; user-select:none;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2A2A32;border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#3A3A44}

/* ---------- Каркас ---------- */
.app{display:flex;flex-direction:column;height:100vh}

/* Шапка */
.topbar{
  display:flex;align-items:center;gap:16px;
  padding:0 22px;height:64px;flex-shrink:0;
  background:linear-gradient(180deg,#0E0E12 0%,#0B0B0D 100%);
  border-bottom:1px solid var(--stroke);
}
.logo{display:flex;align-items:center;gap:12px}
.logo .k{
  width:42px;height:42px;border-radius:11px;background:var(--bg);
  border:1px solid #3A3220;display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.logo .k svg{width:26px;height:26px}
.logo .name{font-size:19px;font-weight:800;letter-spacing:3px}
.logo .name b{background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .sub{font-size:10px;color:var(--dim2);letter-spacing:1px;margin-top:1px}

/* Вкладки сверху */
.tabs{display:flex;gap:4px;margin-left:18px;flex:1}
.tab{
  display:flex;align-items:center;gap:9px;height:38px;padding:0 15px;border-radius:9px;
  color:var(--dim);font-size:13.5px;font-weight:500;cursor:pointer;
  transition:all .15s;border:1px solid transparent;white-space:nowrap;
}
.tab svg{width:16px;height:16px;opacity:.7}
.tab:hover{background:var(--panel2);color:#C9C9D2}
.tab.active{background:#1C180E;color:var(--gold3);border-color:#3A3220}
.tab.active svg{opacity:1}

.status-pill{
  display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:20px;
  background:var(--panel);border:1px solid var(--stroke);font-size:12px;color:var(--dim);
}
.status-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}

/* Контент */
.content{flex:1;overflow-y:auto;padding:26px 30px}
.page{display:none;animation:fade .25s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.page-head{margin-bottom:20px}
.page-head h1{font-size:23px;font-weight:700;letter-spacing:-.3px}
.page-head p{color:var(--dim);font-size:13.5px;margin-top:6px;max-width:760px;line-height:1.5}

/* Карточки/секции */
.card{background:var(--panel);border:1px solid var(--stroke);border-radius:14px;padding:20px}
.section-label{font-size:11px;font-weight:600;letter-spacing:1.3px;color:var(--dim2);margin:22px 2px 11px;text-transform:uppercase}
.section-label:first-child{margin-top:0}

/* Твик-строка */
.tweak{
  display:flex;align-items:flex-start;gap:14px;padding:15px 18px;border-radius:12px;
  background:var(--panel);border:1px solid var(--stroke);margin-bottom:9px;transition:border-color .15s;
}
.tweak:hover{border-color:var(--stroke2)}
.tweak .main{flex:1;min-width:0}
.tweak .title-row{display:flex;align-items:center;gap:10px}
.tweak .t-name{font-size:14.5px;font-weight:600}
.tweak .t-desc{color:var(--dim);font-size:12.5px;margin-top:4px;line-height:1.5}
.badge{font-size:10px;font-weight:600;letter-spacing:.3px;padding:3px 8px;border-radius:6px}
.badge.perm{background:#13241A;color:var(--green);border:1px solid #1E3A2A}
.badge.reboot{background:#241A0E;color:var(--amber);border:1px solid #3A2E1A}
.badge.applied{background:var(--goldgrad);color:#15120A}

/* Переключатель */
.switch{position:relative;width:44px;height:25px;flex-shrink:0;cursor:pointer;margin-top:2px}
.switch input{display:none}
.switch .slider{position:absolute;inset:0;background:#2A2A32;border-radius:13px;transition:.2s}
.switch .slider:before{content:'';position:absolute;width:19px;height:19px;left:3px;top:3px;background:#8A8A92;border-radius:50%;transition:.2s}
.switch input:checked+.slider{background:var(--goldgrad)}
.switch input:checked+.slider:before{transform:translateX(19px);background:#15120A}

/* Кнопки */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  height:42px;padding:0 22px;border-radius:10px;border:none;cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:600;transition:all .15s;
}
.btn.gold{background:var(--goldgrad);color:#15120A}
.btn.gold:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--panel2);color:var(--gold2);border:1px solid #3A3220}
.btn.ghost:hover{background:#20201A}
.btn.dark{background:var(--panel2);color:var(--txt);border:1px solid var(--stroke)}
.btn.dark:hover{border-color:var(--stroke2)}
.btn.sm{height:34px;padding:0 15px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:default}
.btn svg{width:17px;height:17px}

/* Главная */
.hero{
  display:flex;gap:22px;align-items:stretch;margin-bottom:22px;
}
.hero-main{
  flex:1;background:radial-gradient(120% 140% at 0% 0%,#1A160C 0%,#121216 55%);
  border:1px solid #3A3220;border-radius:18px;padding:28px;display:flex;flex-direction:column;
}
.hero-main h2{font-size:21px;font-weight:700}
.hero-main p{color:var(--dim);font-size:13.5px;margin-top:8px;line-height:1.55;max-width:420px}
.hero-main .btn{margin-top:auto;align-self:flex-start;height:48px;padding:0 28px;font-size:15px}
.gauge{
  width:220px;background:var(--panel);border:1px solid var(--stroke);border-radius:18px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;
}
.gauge .ring{position:relative;width:140px;height:140px}
.gauge .score{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge .score b{font-size:38px;font-weight:800;background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.gauge .score span{font-size:11px;color:var(--dim2);letter-spacing:1px;margin-top:3px}
.gauge .label{margin-top:14px;font-size:13px;color:var(--dim);text-align:center}

.specs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.spec{background:var(--panel);border:1px solid var(--stroke);border-radius:13px;padding:16px}
.spec .ic{width:34px;height:34px;border-radius:9px;background:#1C180E;display:flex;align-items:center;justify-content:center;margin-bottom:11px}
.spec .ic svg{width:18px;height:18px}
.spec .lbl{font-size:11px;color:var(--dim2);letter-spacing:.5px;text-transform:uppercase}
.spec .val{font-size:14.5px;font-weight:600;margin-top:4px;line-height:1.35}
.spec .val small{color:var(--dim);font-weight:400;font-size:12px}

/* UWP двухколоночный */
.uwp-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.uwp-toolbar .count{margin-left:auto;color:var(--dim);font-size:12.5px}
.uwp-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:4px 26px;
  background:var(--panel);border:1px solid var(--stroke);border-radius:14px;padding:14px 20px;
}
.uwp-item{display:flex;align-items:center;gap:11px;padding:9px 6px;border-radius:8px;cursor:pointer;transition:background .12s}
.uwp-item:hover{background:var(--panel2)}
.uwp-item.off{opacity:.38}
.chk{width:19px;height:19px;border-radius:5px;border:1.5px solid #3A3A44;flex-shrink:0;position:relative;transition:.15s}
.uwp-item.sel .chk{background:var(--goldgrad);border-color:transparent}
.uwp-item.sel .chk:after{content:'';position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #15120A;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.uwp-item .nm{font-size:13.5px}
.uwp-item .tag{margin-left:auto;font-size:10px;color:var(--dim2)}

/* 3 карточки Store/Edge/WebView */
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.trio .card{display:flex;flex-direction:column}
.trio .ic{width:46px;height:46px;border-radius:12px;background:#1C180E;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.trio .ic svg{width:24px;height:24px}
.trio h3{font-size:16px;font-weight:700}
.trio p{color:var(--dim);font-size:12.5px;margin:8px 0 16px;line-height:1.55;flex:1}
.warn{display:flex;gap:9px;background:#241A0E;border:1px solid #3A2E1A;border-radius:9px;padding:10px 12px;margin-bottom:14px;font-size:12px;color:#C9BFA6;line-height:1.45}
.warn svg{width:16px;height:16px;flex-shrink:0;margin-top:1px;color:var(--amber)}

/* Программы */
.apps-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.appcard{background:var(--panel);border:1px solid var(--stroke);border-radius:13px;padding:17px;display:flex;flex-direction:column}
.appcard .top{display:flex;align-items:center;gap:12px;margin-bottom:11px}
.appcard .ico{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex-shrink:0}
.appcard h4{font-size:14.5px;font-weight:600}
.appcard .cat{font-size:11px;color:var(--dim2)}
.appcard p{color:var(--dim);font-size:12px;line-height:1.5;flex:1;margin-bottom:13px}
.appcard .foot{display:flex;align-items:center;gap:8px}
.offline-dot{font-size:11px;color:var(--green);display:flex;align-items:center;gap:5px}
.offline-dot.no{color:var(--dim2)}
.offline-dot i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}

/* Защита */
.shield-status{display:flex;gap:16px;margin-bottom:20px}
.shield-card{flex:1;background:var(--panel);border:1px solid var(--stroke);border-radius:14px;padding:20px;display:flex;align-items:center;gap:16px}
.shield-card .ring{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.shield-card.on .ring{background:#13241A;border:1px solid #1E3A2A}
.shield-card.off .ring{background:#241316;border:1px solid #3A1E22}
.shield-card .ring svg{width:26px;height:26px}
.shield-card.on .ring svg{color:var(--green)}
.shield-card.off .ring svg{color:var(--red)}
.shield-card .st{font-size:15px;font-weight:600}
.shield-card .ds{font-size:12px;color:var(--dim);margin-top:3px}

/* Драйверы */
.drv-row{display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--panel);border:1px solid var(--stroke);border-radius:11px;margin-bottom:8px}
.drv-row .di{width:36px;height:36px;border-radius:9px;background:#1C180E;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.drv-row .di svg{width:19px;height:19px}
.drv-row .dn{font-size:14px;font-weight:600}
.drv-row .dv{font-size:12px;color:var(--dim);margin-top:2px}
.drv-row .dv b{color:var(--gold2);font-weight:600}
.drv-row .st{margin-left:auto;font-size:12px;padding:5px 11px;border-radius:7px}
.drv-row .st.upd{background:#1C180E;color:var(--gold2)}
.drv-row .st.ok{background:#13241A;color:var(--green)}

/* Журнал */
.log{background:#0A0A0C;border:1px solid var(--stroke);border-radius:13px;padding:6px;font-family:'Consolas','Courier New',monospace;font-size:12.5px;height:calc(100vh - 230px);overflow-y:auto}
.log .ln{display:flex;gap:12px;padding:5px 12px;border-radius:5px}
.log .ln:hover{background:#101014}
.log .ts{color:var(--dim2);flex-shrink:0}
.log .lv{flex-shrink:0;width:50px;font-weight:600}
.log .lv.OK{color:var(--green)} .log .lv.INFO{color:#7AA7D9} .log .lv.WARN{color:var(--amber)} .log .lv.ERR{color:var(--red)}
.log .msg{color:#C4C4CC}

/* Прогресс оверлей */
.overlay{position:fixed;inset:0;background:rgba(8,8,10,.82);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:50}
.overlay.show{display:flex}
.pbox{width:440px;background:var(--panel);border:1px solid #3A3220;border-radius:16px;padding:26px}
.pbox h3{font-size:16px;font-weight:700;margin-bottom:4px}
.pbox .cur{color:var(--dim);font-size:12.5px;margin-bottom:16px;min-height:18px}
.pbar{height:7px;background:#17171C;border-radius:4px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--goldgrad);border-radius:4px;transition:width .3s}
.foot-note{margin-top:22px;color:var(--dim2);font-size:11.5px;text-align:center;line-height:1.5}
</style>
</head>
<body>
<div class="app">
  <!-- ШАПКА + ВКЛАДКИ -->
  <div class="topbar">
    <div class="logo">
      <div class="k">
        <svg viewBox="0 0 100 100" fill="none">
          <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#B8860B"/><stop offset=".5" stop-color="#E8C15A"/><stop offset="1" stop-color="#F5D77E"/>
          </linearGradient></defs>
          <path d="M22 12 H38 V44 L68 12 H88 L52 50 L88 88 H66 L38 58 V88 H22 Z" fill="url(#g)"/>
        </svg>
      </div>
      <div><div class="name"><b>KERNEL</b></div><div class="sub">SYSTEM OPTIMIZER</div></div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="status-pill"><span class="dot"></span>Администратор</div>
  </div>

  <!-- КОНТЕНТ -->
  <div class="content" id="content"></div>
</div>

<!-- Оверлей прогресса -->
<div class="overlay" id="overlay">
  <div class="pbox">
    <h3 id="p-title">Применяю настройки…</h3>
    <div class="cur" id="p-cur">—</div>
    <div class="pbar"><i id="p-bar"></i></div>
  </div>
</div>

<script src="mock.js"></script>
<script src="app.js"></script>
</body>
</html>
